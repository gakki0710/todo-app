<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク登録・編集 - タスク管理アプリ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="form-page">
<div class="container form-container">

    <h2 class="mb-4 text-center text-primary">✏️ タスクの編集</h2>

    <form action="" method="POST">

        <div class="mb-3">
            <label class="form-label fw-bold">タスク名</label>
            <p>タスク名</p>
        </div>

        <div class="mb-4">
            <label for="detail" class="form-label fw-bold">詳細説明</label>
            <textarea id="detail" class="form-control" rows="4" placeholder="タスクの具体的な内容を入力してください（任意）"></textarea>
            <div class="invalid-feedback">
                詳細説明のエラーメッセージ
            </div>
        </div>

        <div class="mb-4">
            <label for="status" class="form-label fw-bold">ステータス</label>
            <select id="status" class="form-select">
                <option value="NOT_STARTED">未着手</option>
                <option value="IN_PROGRESS">対応中</option>
                <option value="DONE">完了</option>
            </select>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/todo}" class="btn btn-outline-secondary style-btn">キャンセル</a>
            <button type="submit" class="btn btn-primary style-btn px-4">更新する</button>
        </div>

    </form>
</div>
</body>
</html>
