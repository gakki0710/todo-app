<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo一覧 - タスク管理アプリ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="list-page">
<div class="container" style="max-width: 1500px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 text-primary">📋 タスク一覧</h1>
        <a th:href="@{/todo/add}" class="btn btn-primary">+ 新規タスク追加</a>
    </div>

    <div class="card">
        <div class="card-header bg-white text-dark fw-bold">📌 未完了のタスク</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle todo-table">
                <thead class="table-light">
                <tr>
                    <th style="width: 8%;">ID</th>
                    <th style="width: 25%;">タスク名</th>
                    <th style="width: 32%;">詳細説明</th>
                    <th style="width: 15%;" class="text-center">ステータス</th>
                    <th style="width: 20%;" class="text-center">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td >1</td>
                    <td class="text-ellipsis">
                        <a th:href="@{/todo/edit}" class="fw-bold text-decoration-none">タスク名</a>
                    </td>
                    <td class="text-ellipsis">
                        詳細説明文が入ります。
                    </td>
                    <td class="text-center">
                        <span class="badge bg-secondary">未着手</span>
                    </td>

                    <td class="text-center">
                        <form action="#" method="POST" style="display:inline;"
                              onsubmit="return confirm('本当にこのタスクを削除しますか？');">
                            <button type="submit" class="btn btn-outline-danger btn-sm">削除</button>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td >2</td>
                    <td class="text-ellipsis">
                        <a th:href="@{/todo/edit}" class="fw-bold text-decoration-none">タスク名</a>
                    </td>
                    <td class="text-ellipsis">
                        詳細説明文が入ります。長い文字は三点リーダーにおきかわります
                    </td>
                    <td class="text-center">
                        <span class="badge bg-warning text-dark">対応中</span>
                    </td>

                    <td class="text-center">
                        <form action="#" method="POST" style="display:inline;"
                              onsubmit="return confirm('本当にこのタスクを削除しますか？');">
                            <button type="submit" class="btn btn-outline-danger btn-sm">削除</button>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td colspan="5" class="text-center text-muted py-4">現在、未完了のタスクはありません。</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-light text-secondary fw-bold">✅ 完了済みのタスク</div>
        <div class="card-body p-0">
            <table class="table mb-0 align-middle">
                <tbody>
                <tr >
                    <td style="width: 8%;"  class="text-secondary">3</td>
                    <td style="width: 30%;"  class="done-item">完了したタスク名</td>
                    <td style="width: 37%;"  class="done-item text-secondary">完了した詳細説明。</td>
                    <td style="width: 25%;" class="text-center">
                        <form action="" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-secondary btn-sm">戻す</button>
                        </form>
                        <form action="" method="POST" style="display:inline;"
                              onsubmit="return confirm('本当にこのタスクを削除しますか？');">
                            <button type="submit" class="btn btn-outline-danger btn-sm">削除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
