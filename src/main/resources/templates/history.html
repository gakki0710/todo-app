<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク変更履歴 - タスク管理アプリ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="list-page">
<div class="container" style="max-width: 1200px; margin-top: 40px;">

    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h2 class="h3 text-primary" style="margin-bottom: 35px;">📜 タスク変更履歴</h2>
            <div class="fs-5 fw-bold text-dark">
                対象タスク：<span>要件定義書の作成</span>
            </div>
        </div>
        <!-- 一覧へ戻るボタン -->
        <a th:href="@{/todo}" class="btn btn-outline-secondary style-btn">一覧へ戻る</a>
    </div>

    <!-- 履歴一覧テーブル -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th style="width: 22%;">変更日時</th>
                    <th style="width: 48%;">詳細説明</th>
                    <th style="width: 15%;" class="text-center">ステータス</th>
                    <th style="width: 15%;" class="text-center">期日</th>
                </tr>
                </thead>
                <tbody>
                <!-- サンプル1 -->
                <tr th:each="history : ${historyList}">
                    <td class="text-muted" th:text="${#temporals.format(history.updatedAt, 'yyyy/MM/dd HH:mm:ss')}">
                        2026/08/30 14:00:00
                    </td>
                    <td th:text="${history.detail}">
                        仕様書に基づき画面設計書およびデータディクショナリの項目定義を作成する。
                    </td>
                    <td class="text-center">
                        <span class="badge bg-warning text-dark" th:text="${history.status}">対応中</span>
                    </td>
                    <td class="text-center fw-bold" th:text="${#temporals.format(history.dueDate, 'yyyy/MM/dd')}">
                        2026/09/15
                    </td>
                </tr>

                <!-- サンプル2 -->
                <tr>
                    <td class="text-muted">2026/08/29 10:15:30</td>
                    <td>初期登録時の内容が入ります。</td>
                    <td class="text-center">
                        <span class="badge bg-secondary">未着手</span>
                    </td>
                    <td class="text-center fw-bold">2026/09/10</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
