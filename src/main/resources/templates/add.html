<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク登録・編集 - タスク管理アプリ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="form-page">
<div class="container form-container">

    <h2 class="mb-4 text-center text-primary">➕ 新規タスク登録</h2>

    <form action="" method="POST">

        <div class="mb-3">
            <label for="title" class="form-label fw-bold">タスク名 <span class="text-danger">*必須</span></label>
            <input type="text" id="title" class="form-control is-invalid" placeholder="例：要件定義書を作る">
            <div class="invalid-feedback" >
                タスク名のエラーメッセージ
            </div>
        </div>

        <div class="mb-4">
            <label for="detail" class="form-label fw-bold">詳細説明</label>
            <textarea id="detail" class="form-control is-invalid" rows="4" placeholder="タスクの具体的な内容を入力してください（任意）"></textarea>
            <div class="invalid-feedback">
                詳細説明のエラーメッセージ
            </div>
        </div>

        <!-- 期日入力項目（過去日は非活性・キーボード入力不可） -->
        <div class="mb-4">
            <label for="dueDate" class="form-label fw-bold">期日</label>
            <input type="date" id="dueDate" class="form-control">
            <div class="invalid-feedback">
                期日のエラーメッセージ
            </div>
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/todo}" class="btn btn-outline-secondary style-btn">キャンセル</a>
            <button type="submit" class="btn btn-primary style-btn px-4">登録する</button>
        </div>

    </form>
</div>

<!-- JSファイルの読み込み -->
<script th:src="@{/js/common.js}"></script>
</body>
</html>
